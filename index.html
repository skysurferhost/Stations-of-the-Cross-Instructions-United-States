<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stations of the Cross PDF Viewer United States</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root {
    --bar-height: 44px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: Arial, sans-serif;
    overscroll-behavior: none;
  }

  /* ===== TOOLBAR ===== */
  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--bar-height);
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 1000;
    contain: layout paint;
  }

  .toolbar button,
  .page-nav button {
    background: #fff;
    border: none;
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* ===== VIEWER ===== */
  #viewer-container {
    position: absolute;
    top: var(--bar-height);
    bottom: var(--bar-height);
    left: 0;
    right: 0;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    background: #111;
  }

  #viewer {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    cursor: grab;
    will-change: transform;
    backface-visibility: hidden;
  }

  #viewer.dragging { cursor: grabbing; }

  .page-shell {
    position: absolute;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    contain: layout paint style;
  }

  .page-canvas {
    background: #fff;
    display: block;
  }

  .page-placeholder {
    background: #fff;
    opacity: 0.10;
  }

  /* ===== BOTTOM BAR ===== */
  .page-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--bar-height);
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 1000;
    color: #fff;
    font-size: 14px;
    contain: layout paint;
  }

  @media (max-width: 768px) {
    :root { --bar-height: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #viewer { will-change: auto; }
  }
</style>
</head>

<body>

<div class="toolbar">
  <button id="zoomOutBtn" type="button" aria-label="Zoom out">−</button>
  <button id="zoomInBtn" type="button" aria-label="Zoom in">+</button>
  <button id="fullscreenBtn" type="button">⤢ Fullscreen</button>
</div>

<div id="viewer-container" aria-label="PDF viewer">
  <div id="viewer"></div>
</div>

<div class="page-nav">
  <button id="prevPageBtn" type="button" aria-label="Previous page">◀</button>
  <span id="pageIndicator" aria-live="polite">Loading…</span>
  <button id="nextPageBtn" type="button" aria-label="Next page">▶</button>
</div>

<script>
(() => {
  'use strict';

  // PDF file used by this viewer.
  const PDF_URL = './Stations_of_the_Cross_Instructions_United_States.pdf';

  // Use PDF.js in a real Web Worker instead of the slower fake-worker fallback.
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const viewer = document.getElementById('viewer');
  const container = document.getElementById('viewer-container');
  const indicator = document.getElementById('pageIndicator');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  let pdfDoc = null;
  let totalPages = 0;

  // Keep the same general starting view as the original file.
  let scale = window.innerWidth < 768 ? 0.22 : 0.30;
  const MIN_SCALE = 0.12;
  const MAX_SCALE = 4;

  let x = 0;
  let y = 0;
  let rafPending = false;
  let renderTickScheduled = false;
  let currentPage = 1;

  const PAGE_GAP = 24;
  let stripWidth = 0;
  let stripHeight = 0;
  let pageRects = [];
  let pageNodes = [];

  // Performance tuning.
  const RENDER_AHEAD_PX = 900;
  const UNLOAD_BEHIND_PX = 1800;
  const MAX_RENDER_SCALE = 4;
  const MAX_CANVAS_PIXELS = 12_000_000;
  const MAX_CANVAS_DIMENSION = 4096;
  const MAX_CONCURRENT_RENDERS = matchMedia('(pointer: coarse)').matches ? 1 : 2;
  const PAGE_MEASURE_BATCH = matchMedia('(pointer: coarse)').matches ? 3 : 6;

  let activeRenders = 0;
  let renderQueue = [];
  const renderedIndices = new Set();
  let interactionActive = false;
  let wheelSettling = false;
  let wheelSettleTimer = 0;

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function clampScale(value) {
    return clamp(value, MIN_SCALE, MAX_SCALE);
  }

  async function loadPdf() {
    try {
      const loadingTask = pdfjsLib.getDocument({ url: PDF_URL });
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      await buildLazyLayout();
      resetView();
      updateIndicator();
      scheduleRenderTick();
    } catch (error) {
      console.error('PDF load failed:', error);
      indicator.textContent = 'Could not load PDF';
    }
  }

  async function buildLazyLayout() {
    viewer.replaceChildren();
    pageRects = [];
    pageNodes = [];
    renderedIndices.clear();
    stripWidth = 0;
    stripHeight = 0;

    const viewports = new Array(totalPages);

    // Measure pages in small parallel batches. This is faster than waiting for
    // every getPage() sequentially, without flooding PDF.js on low-power devices.
    for (let start = 1; start <= totalPages; start += PAGE_MEASURE_BATCH) {
      const end = Math.min(totalPages, start + PAGE_MEASURE_BATCH - 1);
      const numbers = [];
      for (let n = start; n <= end; n++) numbers.push(n);

      const pages = await Promise.all(numbers.map(n => pdfDoc.getPage(n)));
      pages.forEach((page, offset) => {
        const pageNumber = start + offset;
        const viewport = page.getViewport({ scale: 1 });
        viewports[pageNumber - 1] = viewport;
        stripWidth = Math.max(stripWidth, Math.ceil(viewport.width));
      });

      // Let the browser paint between batches on longer documents.
      await new Promise(resolve => requestAnimationFrame(resolve));
    }

    let yCursor = 0;
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < totalPages; i++) {
      const vp = viewports[i];
      const width = Math.ceil(vp.width);
      const height = Math.ceil(vp.height);

      const rect = {
        page: i + 1,
        yTop: yCursor,
        yBottom: yCursor + height,
        width,
        height
      };
      pageRects.push(rect);

      const shell = document.createElement('div');
      shell.className = 'page-shell';
      shell.style.top = rect.yTop + 'px';
      shell.style.height = rect.height + 'px';

      const placeholder = document.createElement('div');
      placeholder.className = 'page-placeholder';
      placeholder.style.width = rect.width + 'px';
      placeholder.style.height = rect.height + 'px';

      shell.appendChild(placeholder);
      fragment.appendChild(shell);

      pageNodes.push({
        shell,
        placeholder,
        node: placeholder,
        rendered: false,
        rendering: false,
        renderScale: 0,
        requestedScale: 0,
        targetScale: 0,
        queued: false,
        renderTask: null,
        generation: 0
      });

      yCursor += height + (i === totalPages - 1 ? 0 : PAGE_GAP);
    }

    stripHeight = yCursor;
    viewer.style.width = stripWidth + 'px';
    viewer.style.height = stripHeight + 'px';
    viewer.appendChild(fragment);
  }

  function resetView() {
    x = (container.clientWidth - stripWidth * scale) / 2;
    y = 20;
    applyTransform();
  }

  function applyTransform() {
    if (rafPending) return;
    rafPending = true;

    requestAnimationFrame(() => {
      viewer.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
      rafPending = false;
      updateIndicator();
      scheduleRenderTick();
    });
  }

  function setScaleAtPoint(nextScale, cx, cy) {
    const previous = scale;
    const clamped = clampScale(nextScale);
    if (Math.abs(clamped - previous) < 0.00001) return;

    const worldX = (cx - x) / previous;
    const worldY = (cy - y) / previous;

    scale = clamped;
    x = cx - worldX * scale;
    y = cy - worldY * scale;
    applyTransform();
  }

  function zoomByFactor(factor, cx, cy) {
    setScaleAtPoint(scale * factor, cx, cy);
  }

  function zoomIn() {
    zoomByFactor(1.2, container.clientWidth / 2, container.clientHeight / 2);
  }

  function zoomOut() {
    zoomByFactor(1 / 1.2, container.clientWidth / 2, container.clientHeight / 2);
  }

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (error) {
      console.warn('Fullscreen request failed:', error);
    }
  }

  function pageIndexAtWorldY(worldY) {
    if (!pageRects.length) return 0;

    let low = 0;
    let high = pageRects.length - 1;
    let best = 0;

    while (low <= high) {
      const mid = (low + high) >> 1;
      const rect = pageRects[mid];
      if (worldY < rect.yTop) {
        high = mid - 1;
      } else if (worldY > rect.yBottom) {
        best = mid;
        low = mid + 1;
      } else {
        return mid;
      }
    }

    return clamp(best, 0, pageRects.length - 1);
  }

  function firstPageIndexIntersecting(yValue) {
    let low = 0;
    let high = pageRects.length - 1;
    let result = pageRects.length;

    while (low <= high) {
      const mid = (low + high) >> 1;
      if (pageRects[mid].yBottom >= yValue) {
        result = mid;
        high = mid - 1;
      } else {
        low = mid + 1;
      }
    }
    return result;
  }

  function lastPageIndexIntersecting(yValue) {
    let low = 0;
    let high = pageRects.length - 1;
    let result = -1;

    while (low <= high) {
      const mid = (low + high) >> 1;
      if (pageRects[mid].yTop <= yValue) {
        result = mid;
        low = mid + 1;
      } else {
        high = mid - 1;
      }
    }
    return result;
  }

  function updateIndicator() {
    if (!totalPages || !pageRects.length) return;
    const viewCenterY = (container.clientHeight / 2 - y) / scale;
    currentPage = pageRects[pageIndexAtWorldY(viewCenterY)].page;
    indicator.textContent = `Page ${currentPage} / ${totalPages}`;
  }

  function scrollToPage(pageNumber) {
    const index = pageNumber - 1;
    const rect = pageRects[index];
    if (!rect) return;
    y = 20 - rect.yTop * scale;
    applyTransform();
  }

  function nextPage() {
    if (currentPage < totalPages) scrollToPage(currentPage + 1);
  }

  function prevPage() {
    if (currentPage > 1) scrollToPage(currentPage - 1);
  }

  function desiredRenderScaleFor(index) {
    const rect = pageRects[index];
    if (!rect) return 1;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let desired = clamp(scale * dpr * 1.12, 0.75, MAX_RENDER_SCALE);

    // While actively moving/zooming, favor responsiveness. Full quality is
    // requested automatically as soon as the gesture settles.
    if (interactionActive || wheelSettling) desired = Math.min(desired, 1.5);

    const byPixels = Math.sqrt(MAX_CANVAS_PIXELS / Math.max(1, rect.width * rect.height));
    const byWidth = MAX_CANVAS_DIMENSION / Math.max(1, rect.width);
    const byHeight = MAX_CANVAS_DIMENSION / Math.max(1, rect.height);

    return Math.max(0.5, Math.min(desired, byPixels, byWidth, byHeight));
  }

  function scheduleRenderTick() {
    if (renderTickScheduled) return;
    renderTickScheduled = true;
    requestAnimationFrame(() => {
      renderTickScheduled = false;
      renderVisiblePages();
    });
  }

  function renderVisiblePages() {
    if (!pdfDoc || !pageRects.length || document.hidden) return;

    const topPdfY = -y / scale;
    const bottomPdfY = (container.clientHeight - y) / scale;
    const aheadPdf = RENDER_AHEAD_PX / scale;
    const unloadPdf = UNLOAD_BEHIND_PX / scale;

    const wantTop = topPdfY - aheadPdf;
    const wantBottom = bottomPdfY + aheadPdf;
    const unloadTop = topPdfY - unloadPdf;
    const unloadBottom = bottomPdfY + unloadPdf;

    const first = firstPageIndexIntersecting(wantTop);
    const last = lastPageIndexIntersecting(wantBottom);
    const viewCenter = (topPdfY + bottomPdfY) / 2;

    if (first <= last && first < pageRects.length && last >= 0) {
      for (let i = Math.max(0, first); i <= Math.min(pageRects.length - 1, last); i++) {
        const rect = pageRects[i];
        const desiredScale = desiredRenderScaleFor(i);
        const priority = Math.abs((rect.yTop + rect.yBottom) / 2 - viewCenter);
        queuePageRender(i, desiredScale, priority);
      }
    }

    // Only inspect pages that actually own canvases when deciding what to unload.
    for (const index of Array.from(renderedIndices)) {
      const rect = pageRects[index];
      if (rect.yBottom < unloadTop || rect.yTop > unloadBottom) unloadPageNode(index);
    }

    // Cancel expensive renders that became very far away before completion.
    for (let i = 0; i < pageNodes.length; i++) {
      const node = pageNodes[i];
      if (!node.rendering) continue;
      const rect = pageRects[i];
      if (rect.yBottom < unloadTop || rect.yTop > unloadBottom) cancelPageRender(i);
    }

    pumpRenderQueue();
  }

  function queuePageRender(index, renderScale, priority) {
    const node = pageNodes[index];
    if (!node) return;

    node.targetScale = Math.max(node.targetScale || 0, renderScale);

    if (node.rendering) return;
    if (node.rendered && node.renderScale >= renderScale * 0.88) return;

    if (!node.queued) {
      node.queued = true;
      renderQueue.push({ index, priority });
    } else {
      const item = renderQueue.find(entry => entry.index === index);
      if (item) item.priority = Math.min(item.priority, priority);
    }
  }

  function pumpRenderQueue() {
    if (activeRenders >= MAX_CONCURRENT_RENDERS || !renderQueue.length) return;

    renderQueue.sort((a, b) => a.priority - b.priority);

    while (activeRenders < MAX_CONCURRENT_RENDERS && renderQueue.length) {
      const item = renderQueue.shift();
      const node = pageNodes[item.index];
      if (!node) continue;
      node.queued = false;

      if (node.rendered && node.renderScale >= node.targetScale * 0.88) {
        node.targetScale = 0;
        continue;
      }

      startPageRender(item.index);
    }
  }

  async function startPageRender(index) {
    const rect = pageRects[index];
    const node = pageNodes[index];
    if (!rect || !node || node.rendering) return;

    const renderScale = Math.max(0.5, node.targetScale || desiredRenderScaleFor(index));
    node.targetScale = 0;
    node.rendering = true;
    node.requestedScale = renderScale;
    node.generation += 1;
    const generation = node.generation;
    activeRenders += 1;

    let canvas = null;

    try {
      const page = await pdfDoc.getPage(rect.page);
      if (generation !== node.generation) return;

      const viewport = page.getViewport({ scale: renderScale });
      canvas = document.createElement('canvas');
      canvas.className = 'page-canvas';
      canvas.width = Math.max(1, Math.floor(viewport.width));
      canvas.height = Math.max(1, Math.floor(viewport.height));
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';

      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      const task = page.render({ canvasContext: ctx, viewport });
      node.renderTask = task;
      await task.promise;

      if (generation !== node.generation) {
        canvas.width = 0;
        canvas.height = 0;
        return;
      }

      const oldCanvas = node.node instanceof HTMLCanvasElement ? node.node : null;
      node.shell.replaceChildren(canvas);
      if (oldCanvas && oldCanvas !== canvas) {
        oldCanvas.width = 0;
        oldCanvas.height = 0;
      }

      node.node = canvas;
      node.rendered = true;
      node.renderScale = renderScale;
      renderedIndices.add(index);
    } catch (error) {
      // Cancellation is normal when a page scrolls far away during rendering.
      if (!error || error.name !== 'RenderingCancelledException') {
        console.warn(`Page ${rect.page} render failed:`, error);
      }
      if (canvas) {
        canvas.width = 0;
        canvas.height = 0;
      }
    } finally {
      if (generation === node.generation) {
        node.rendering = false;
        node.renderTask = null;
      }
      activeRenders = Math.max(0, activeRenders - 1);

      // If zoom increased while this page was rendering, queue one clean upgrade
      // instead of starting overlapping renders for every intermediate zoom step.
      const desiredNow = desiredRenderScaleFor(index);
      if (node.rendered && node.renderScale < desiredNow * 0.88) {
        queuePageRender(index, desiredNow, 0);
      }

      pumpRenderQueue();
    }
  }

  function cancelPageRender(index) {
    const node = pageNodes[index];
    if (!node) return;

    node.generation += 1;
    node.targetScale = 0;
    node.queued = false;
    renderQueue = renderQueue.filter(item => item.index !== index);

    if (node.renderTask && typeof node.renderTask.cancel === 'function') {
      try { node.renderTask.cancel(); } catch (_) {}
    }

    node.renderTask = null;
    node.rendering = false;
  }

  function unloadPageNode(index) {
    const node = pageNodes[index];
    if (!node) return;

    cancelPageRender(index);

    if (node.node instanceof HTMLCanvasElement) {
      node.node.width = 0;
      node.node.height = 0;
    }

    node.shell.replaceChildren(node.placeholder);
    node.node = node.placeholder;
    node.rendered = false;
    node.renderScale = 0;
    renderedIndices.delete(index);
  }

  /* ===== POINTER PAN + PINCH ZOOM ===== */
  const pointers = new Map();
  let dragOriginX = 0;
  let dragOriginY = 0;
  let dragWorldX = 0;
  let dragWorldY = 0;
  let pinchStartDistance = 0;
  let pinchStartScale = scale;
  let pinchWorldX = 0;
  let pinchWorldY = 0;
  let primaryDownX = 0;
  let primaryDownY = 0;
  let primaryMoved = false;
  let lastTouchTap = 0;

  function localPoint(event) {
    const rect = container.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  function pointerDistance(a, b) {
    return Math.hypot(b.x - a.x, b.y - a.y);
  }

  function pointerCenter(a, b) {
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  function beginSinglePointerDrag(point) {
    dragOriginX = point.x;
    dragOriginY = point.y;
    dragWorldX = x;
    dragWorldY = y;
  }

  function beginPinch() {
    const values = Array.from(pointers.values());
    if (values.length < 2) return;
    const a = values[0];
    const b = values[1];
    const center = pointerCenter(a, b);
    pinchStartDistance = Math.max(1, pointerDistance(a, b));
    pinchStartScale = scale;
    pinchWorldX = (center.x - x) / scale;
    pinchWorldY = (center.y - y) / scale;
  }

  container.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    event.preventDefault();

    const point = localPoint(event);
    pointers.set(event.pointerId, point);
    interactionActive = true;
    viewer.classList.add('dragging');

    try { container.setPointerCapture(event.pointerId); } catch (_) {}

    if (pointers.size === 1) {
      beginSinglePointerDrag(point);
      primaryDownX = point.x;
      primaryDownY = point.y;
      primaryMoved = false;
    } else if (pointers.size === 2) {
      beginPinch();
    }
  });

  container.addEventListener('pointermove', event => {
    if (!pointers.has(event.pointerId)) return;
    event.preventDefault();

    const point = localPoint(event);
    pointers.set(event.pointerId, point);

    if (pointers.size === 1) {
      const only = Array.from(pointers.values())[0];
      x = dragWorldX + (only.x - dragOriginX);
      y = dragWorldY + (only.y - dragOriginY);
      if (Math.hypot(only.x - primaryDownX, only.y - primaryDownY) > 6) primaryMoved = true;
      applyTransform();
      return;
    }

    if (pointers.size >= 2) {
      const values = Array.from(pointers.values());
      const a = values[0];
      const b = values[1];
      const center = pointerCenter(a, b);
      const distance = Math.max(1, pointerDistance(a, b));
      const nextScale = clampScale(pinchStartScale * (distance / pinchStartDistance));

      scale = nextScale;
      x = center.x - pinchWorldX * scale;
      y = center.y - pinchWorldY * scale;
      primaryMoved = true;
      applyTransform();
    }
  }, { passive: false });

  function finishPointer(event) {
    if (!pointers.has(event.pointerId)) return;
    const wasSingle = pointers.size === 1;
    const point = pointers.get(event.pointerId);
    pointers.delete(event.pointerId);

    try { container.releasePointerCapture(event.pointerId); } catch (_) {}

    if (wasSingle && event.pointerType === 'touch' && !primaryMoved) {
      const now = performance.now();
      if (now - lastTouchTap < 320) {
        zoomByFactor(scale > 1 ? 0.8 / scale : 1.6, point.x, point.y);
        lastTouchTap = 0;
      } else {
        lastTouchTap = now;
      }
    }

    if (pointers.size === 1) {
      const remaining = Array.from(pointers.values())[0];
      beginSinglePointerDrag(remaining);
      primaryDownX = remaining.x;
      primaryDownY = remaining.y;
      primaryMoved = false;
    } else if (pointers.size >= 2) {
      beginPinch();
    } else {
      interactionActive = false;
      viewer.classList.remove('dragging');
      scheduleRenderTick();
    }
  }

  container.addEventListener('pointerup', finishPointer);
  container.addEventListener('pointercancel', finishPointer);
  container.addEventListener('lostpointercapture', event => {
    if (pointers.has(event.pointerId)) finishPointer(event);
  });

  /* ===== DESKTOP / TRACKPAD WHEEL ZOOM ===== */
  container.addEventListener('wheel', event => {
    event.preventDefault();

    const rect = container.getBoundingClientRect();
    const cx = event.clientX - rect.left;
    const cy = event.clientY - rect.top;

    // Exponential zoom feels consistent for both mouse wheels and trackpads.
    const delta = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
    const factor = Math.exp(-delta * 0.0015);

    wheelSettling = true;
    clearTimeout(wheelSettleTimer);
    wheelSettleTimer = setTimeout(() => {
      wheelSettling = false;
      scheduleRenderTick();
    }, 140);

    zoomByFactor(factor, cx, cy);
  }, { passive: false });

  /* ===== DOUBLE-CLICK ZOOM ===== */
  container.addEventListener('dblclick', event => {
    const point = localPoint(event);
    zoomByFactor(scale > 1 ? 0.8 / scale : 1.6, point.x, point.y);
  });

  /* ===== RESIZE / FULLSCREEN ===== */
  let lastContainerWidth = 0;
  let lastContainerHeight = 0;

  const resizeObserver = new ResizeObserver(entries => {
    const entry = entries[0];
    if (!entry) return;

    const nextWidth = entry.contentRect.width;
    const nextHeight = entry.contentRect.height;

    if (lastContainerWidth > 0 && lastContainerHeight > 0) {
      const centerWorldX = (lastContainerWidth / 2 - x) / scale;
      const centerWorldY = (lastContainerHeight / 2 - y) / scale;
      x = nextWidth / 2 - centerWorldX * scale;
      y = nextHeight / 2 - centerWorldY * scale;
      applyTransform();
    }

    lastContainerWidth = nextWidth;
    lastContainerHeight = nextHeight;
    scheduleRenderTick();
  });
  resizeObserver.observe(container);

  document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.textContent = document.fullscreenElement ? '⤡ Exit Fullscreen' : '⤢ Fullscreen';
    scheduleRenderTick();
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) scheduleRenderTick();
  });

  /* ===== BUTTONS ===== */
  document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
  document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
  fullscreenBtn.addEventListener('click', toggleFullscreen);
  document.getElementById('prevPageBtn').addEventListener('click', prevPage);
  document.getElementById('nextPageBtn').addEventListener('click', nextPage);

  // Optional keyboard navigation without interfering with form controls.
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const tag = event.target && event.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
      event.preventDefault();
      prevPage();
    } else if (event.key === 'ArrowRight' || event.key === 'PageDown') {
      event.preventDefault();
      nextPage();
    } else if (event.key === '+' || event.key === '=') {
      event.preventDefault();
      zoomIn();
    } else if (event.key === '-') {
      event.preventDefault();
      zoomOut();
    }
  });

  window.addEventListener('beforeunload', () => {
    for (let i = 0; i < pageNodes.length; i++) cancelPageRender(i);
    try { if (pdfDoc) pdfDoc.cleanup(); } catch (_) {}
  });

  loadPdf();
})();
</script>

</body>
</html>
